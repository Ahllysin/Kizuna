<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kizuna</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0%25' stop-color='%23ff6a4a'/%3E%3Cstop offset='70%25' stop-color='%23c2261a'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='29' fill='url(%23g)' stroke='%23ffc54a' stroke-width='3'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%23fff3e0' font-family='serif' font-weight='800'%3E%E7%B5%86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Nunito:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&family=Shippori+Mincho:wght@800&display=swap" rel="stylesheet">
<style>
/* ======================= TOKENS ======================= */
:root{
  --bg:#07080f;
  --text:#efe8d6;
  --text-strong:#fff3da;
  --text-dim:#a4a9b8;
  --text-muted:#8a8fa2;
  --text-faint:#6d7285;
  --text-soft:#c2c4cf;
  --gold:#ffb13b;
  --gold-light:#ffd66b;
  --orange:#ff7a1a;
  --awaken-blue:#4fb8ff;
  --danger:#e0725f;
  --panel:rgba(12,10,18,.92);
  --line:rgba(255,150,50,.45);
  --line-soft:rgba(120,130,170,.22);
  --grad-gold-text:linear-gradient(180deg,#fff6c8 10%,#ffd23f 50%,#e0820b 92%);
  --grad-primary:linear-gradient(180deg,#ff6a2a,#d8361a);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);}
body{color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
a{color:var(--gold);text-decoration:none;}
a:hover{color:var(--gold-light);}
button{white-space:nowrap;cursor:pointer;font-family:inherit;}
::selection{background:#e0401f;color:#fff;}
input::placeholder,textarea::placeholder{color:var(--text-faint);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#2a2438;border-radius:6px;}
::-webkit-scrollbar-track{background:#0a0b14;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes awakenFlicker{0%,100%{filter:none;}50%{filter:brightness(1.6) saturate(1.3);}}

/* ======================= SHELL ======================= */
.kz-app{
  min-height:100vh;position:relative;overflow-x:hidden;
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 1100px 700px at 85% 30%, rgba(120,40,160,.10), transparent 60%),
    radial-gradient(ellipse 900px 600px at 30% 100%, rgba(255,110,20,.08), transparent 60%),
    linear-gradient(rgba(8,6,14,.74), rgba(8,6,14,.74)),
    url('assets/bg-landscape.webp');
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat;
  background-position:0 0,0 0,0 0,center;
  background-size:auto,auto,auto,cover;
  background-attachment:scroll,scroll,scroll,fixed;
}

/* header */
.kz-header{
  position:relative;height:128px;overflow:hidden;z-index:5;
  background-image:url('assets/bg-header-space.png');
  background-size:cover;background-position:center 30%;background-repeat:no-repeat;
  box-shadow:0 2px 0 #ff8a2a, 0 6px 28px rgba(255,120,30,.45);
}
.kz-header-sun{position:absolute;right:16%;top:18px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle, #fff3c4 0%, #ffd46b 45%, rgba(255,170,60,0) 72%);}
.kz-header-hills{
  position:absolute;left:-5%;right:-5%;bottom:-70px;height:130px;opacity:.9;
  background:
    radial-gradient(ellipse 22% 60% at 12% 60%, #2a1030 60%, transparent 61%),
    radial-gradient(ellipse 18% 75% at 34% 70%, #321236 60%, transparent 61%),
    radial-gradient(ellipse 25% 55% at 62% 65%, #2a1030 60%, transparent 61%),
    radial-gradient(ellipse 20% 80% at 88% 70%, #321236 60%, transparent 61%);
}
.kz-header-fade{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(180deg,transparent,rgba(12,6,18,.85));}
.kz-header-inner{position:relative;height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;}
.kz-menu-btn{
  width:54px;height:54px;border-radius:12px;border:1.5px solid var(--gold);background:rgba(10,8,16,.85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex-shrink:0;
  box-shadow:0 0 14px rgba(255,150,40,.35);
}
.kz-menu-btn:hover{background:#1a1220;}
.kz-menu-btn span{width:24px;height:3px;border-radius:2px;background:var(--gold-light);}
.kz-brand{
  display:flex;align-items:center;gap:14px;cursor:pointer;padding:6px 34px 6px 12px;min-width:0;
  background:radial-gradient(ellipse at center, rgba(8,4,10,.82) 30%, rgba(8,4,10,0) 72%);
}
.kz-brand-seal{
  width:70px;height:70px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 35% 30%, #ff6a4a, #c2261a 70%);border:3px solid #ffc54a;
  display:flex;align-items:center;justify-content:center;
  font-family:'Shippori Mincho',serif;font-weight:800;font-size:38px;color:#fff3e0;
  box-shadow:0 0 20px rgba(255,90,30,.7), inset 0 -6px 12px rgba(80,0,0,.5);
}
.kz-brand-name{
  font-family:'Kaushan Script',cursive;font-size:60px;line-height:.95;padding-right:10px;
  background:var(--grad-gold-text);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #3a1200) drop-shadow(0 0 12px rgba(255,160,40,.5));
}
.kz-header-discord-btn{width:auto;flex-shrink:0;padding:11px 20px;font-size:15px;box-shadow:0 0 14px rgba(88,101,242,.45);}
.kz-header-discord-btn svg{flex-shrink:0;}
.kz-header-donate-btn{
  display:flex;align-items:center;gap:8px;flex-shrink:0;padding:11px 18px;border-radius:8px;border:1.5px solid var(--gold);
  background:var(--grad-primary);color:#fff;font-weight:700;font-size:15px;box-shadow:0 0 14px rgba(255,90,30,.4);
}
.kz-header-donate-btn:hover{filter:brightness(1.1);}
.kz-lbl-short{display:none;}
.kz-account{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:10px;background:rgba(8,6,12,.78);border:1px solid rgba(255,170,70,.4);}
.kz-account-name{display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;cursor:pointer;}
.kz-account-name:hover .kz-account-email{color:var(--gold-light);}
.kz-account-email{font-size:13px;color:var(--text);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* layout */
.kz-body{display:flex;align-items:stretch;position:relative;}
.kz-sidebar{
  width:212px;flex-shrink:0;z-index:3;transition:width .2s ease;overflow:hidden;
  background:linear-gradient(180deg,#0c0a14 0%,#120c14 60%,#1a0d0a 100%);
  box-shadow:inset -2px 0 0 #ff7a1a, 6px 0 26px rgba(255,110,20,.28);
}
/* Recolhida, a barra some por completo (largura 0) — só volta pelo ☰ ou, no
   celular, arrastando a partir da borda esquerda da tela. */
.kz-app.nav-compact .kz-sidebar{width:0;box-shadow:none;}
.kz-sidebar-inner{width:212px;}
.kz-sidebar-inner{position:sticky;top:0;height:100vh;padding:22px 12px;display:flex;flex-direction:column;gap:6px;overflow:hidden;}
.kz-nav-btn{
  position:relative;z-index:3;display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:10px;
  border:1.5px solid transparent;background:transparent;color:#c9c3b3;font-size:16px;font-weight:700;text-align:left;
}
.kz-nav-btn:hover{color:var(--text-strong);}
.kz-nav-btn.active{
  background:linear-gradient(90deg, rgba(255,110,20,.38), rgba(255,110,20,.06));border-color:#ff8a2a;color:var(--text-strong);
  box-shadow:0 0 18px rgba(255,120,30,.35);
}
.kz-nav-glyph{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Shippori Mincho',serif;font-weight:800;font-size:20px;
  background:rgba(255,255,255,.04);color:#c9c3b3;border:1.5px solid rgba(255,255,255,.12);
}
.kz-nav-btn.active .kz-nav-glyph{background:radial-gradient(circle at 35% 30%, #ffb35a, #e0461a 75%);color:#fff;border-color:var(--gold-light);}
.kz-sidebar-spacer{flex:1;}
.kz-sidebar-watermark{position:absolute;left:-10px;bottom:120px;font-family:'Shippori Mincho',serif;font-weight:800;font-size:220px;line-height:1;color:rgba(255,170,60,.06);pointer-events:none;}
.kz-sidebar-balls{position:relative;height:190px;flex-shrink:0;pointer-events:none;}
.kz-sidebar-balls img{position:absolute;display:block;}
.kz-sidebar-balls .b4{width:72px;height:72px;left:8px;top:6px;filter:drop-shadow(0 0 18px rgba(255,140,30,.55));}
.kz-sidebar-balls .b7{width:118px;height:118px;left:66px;top:62px;filter:drop-shadow(0 0 30px rgba(255,140,30,.55));}
/* Com 7 botões de nav, a barra lateral só tem altura de sobra pras esferas decorativas
   em telas mais altas — abaixo disso, "overflow:hidden" do .kz-sidebar-inner cortava a
   esfera maior ao meio. Melhor escondê-la inteira do que mostrar cortada. */
@media(max-height:720px){ .kz-sidebar-balls{display:none;} }
.kz-nav-backdrop{display:none;}
.kz-main{flex:1;min-width:0;padding:30px 34px 70px;position:relative;z-index:2;}
.kz-main-watermark{position:absolute;right:-8px;bottom:40px;font-family:'Shippori Mincho',serif;font-weight:800;font-size:360px;line-height:1;color:rgba(255,170,60,.035);pointer-events:none;}
#view{position:relative;z-index:1;animation:fadeUp .35s ease both;}
.kz-loading{padding:80px 0;text-align:center;color:var(--text-dim);}

/* decoração: esfera flutuante */
.kz-float-ball{position:fixed;right:-44px;top:58%;width:110px;height:110px;display:block;pointer-events:none;z-index:4;transform:rotate(-18deg);filter:drop-shadow(0 0 28px rgba(255,140,30,.55));}

/* ======================= COMPONENTES ======================= */
.kz-page{display:flex;flex-direction:column;gap:22px;position:relative;}
.kz-page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.kz-head-actions{display:flex;gap:10px;flex-wrap:wrap;}
.kz-title{
  margin:0;font-family:'Kaushan Script',cursive;font-weight:400;font-size:60px;line-height:1.05;padding-right:10px;
  background:var(--grad-gold-text);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #3a1200);
}
.kz-subtitle{font-size:15px;color:var(--text-dim);margin-top:4px;text-shadow:0 1px 3px #000, 0 0 12px #07080f, 0 0 6px #07080f;}
.kz-label{font-size:13px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
.kz-panel{border-radius:14px;border:1.5px solid var(--line);background:var(--panel);}
.kz-btn{
  padding:11px 20px;border-radius:8px;border:1.5px solid rgba(255,170,70,.5);background:rgba(8,7,14,.8);
  color:var(--text);font-size:15px;font-weight:700;
}
.kz-btn:hover{background:#1a1220;}
.kz-btn-primary{border-color:var(--gold);background:var(--grad-primary);color:#fff;box-shadow:0 0 14px rgba(255,90,30,.35);}
.kz-btn-primary:hover{background:var(--grad-primary);filter:brightness(1.1);}
.kz-btn-sm{padding:7px 14px;font-size:13px;}
.kz-input{
  width:100%;padding:12px 16px;border-radius:10px;border:1.5px solid rgba(255,170,70,.5);background:#08070e;
  color:var(--text);font-family:inherit;font-size:15px;outline:none;
}
.kz-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,150,40,.15);}
.kz-filter-groups{display:flex;flex-direction:column;gap:10px;}
.kz-filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.kz-filter-label{width:78px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold);}
.kz-fchip{
  padding:6px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.18);background:rgba(8,7,14,.75);
  color:#dcd6c6;font-size:14px;font-weight:700;
}
.kz-fchip:hover{border-color:rgba(255,170,70,.6);}
.kz-fchip.active{background:var(--grad-primary);color:#fff;border-color:var(--gold);}
.kz-sf{display:flex;flex-direction:column;gap:10px;}
.kz-sf-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.kz-sf-toggle{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);background:rgba(8,7,14,.75);color:#dcd6c6;font-size:14px;font-weight:800;}
.kz-sf-toggle:hover{border-color:rgba(255,170,70,.6);}
.kz-sf-toggle.has{border-color:var(--gold);color:var(--gold-light);}
.kz-sf-toggle .n{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--grad-primary);color:#fff;font-size:12px;line-height:20px;text-align:center;}
.kz-sf-toggle .caret{font-size:11px;opacity:.8;}
.kz-sf-body{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--line-soft);background:rgba(8,7,14,.55);}
.kz-sf-group{display:flex;flex-direction:column;gap:6px;}
.kz-sf-label{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold);}
.kz-sf-label small{margin-left:6px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--text-dim);}
.kz-sf-chips{display:flex;flex-wrap:wrap;gap:6px;}
.kz-sf-chips .kz-fchip{padding:5px 11px;font-size:13px;}
.kz-sf-chips .kz-fchip .c{margin-left:5px;opacity:.65;font-weight:600;}
.kz-link-btn{align-self:flex-start;padding:6px 0;border:none;background:none;color:var(--gold);font-size:14px;font-weight:700;text-decoration:underline;}
.kz-empty{padding:60px 0;text-align:center;color:var(--text-dim);font-size:16px;}
.kz-muted{font-size:15px;color:var(--text-dim);line-height:1.6;}
.kz-stars{display:inline-flex;gap:1px;line-height:1;}
.kz-eff-pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;}
.kz-eff-dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.avatar-fallback{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:12px;
  font-family:'Shippori Mincho',serif;font-weight:800;color:var(--text-strong);font-size:30px;
  background:linear-gradient(150deg,#3a2350,#1a1226);border:1.5px solid rgba(255,150,50,.35);
}

/* ======================= PERSONAGENS: LISTA ======================= */
.kz-hero{
  position:relative;border-radius:16px;overflow:hidden;min-height:300px;border:1.5px solid rgba(255,150,50,.55);
  box-shadow:0 0 30px rgba(255,120,30,.22), inset 0 0 60px rgba(0,0,0,.6);
  background:
    radial-gradient(ellipse 60% 90% at 78% 40%, rgba(255,180,40,.28), transparent 60%),
    radial-gradient(ellipse 40% 70% at 95% 20%, rgba(150,60,220,.30), transparent 60%),
    linear-gradient(180deg,#0e0c1a,#0a0912);
}
.kz-hero-art{position:absolute;top:0;right:0;bottom:0;width:58%;}
.kz-hero-art-mask{
  position:absolute;inset:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 42%);mask-image:linear-gradient(90deg, transparent 0%, #000 42%);
}
.kz-hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;transform:scale(2.1);transform-origin:50% 35%;}
.kz-hero-scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg, rgba(10,9,18,.94) 0%, rgba(10,9,18,.8) 40%, rgba(10,9,18,0) 68%);}
.kz-hero-name{position:absolute;right:28px;top:18px;font-family:'Kaushan Script',cursive;font-size:30px;color:var(--text-strong);text-shadow:0 2px 10px #000, 0 0 16px rgba(255,140,30,.6);}
.kz-hero-content{position:relative;padding:30px 34px;display:flex;flex-direction:column;gap:16px;max-width:640px;}
.kz-hero-titlerow{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;}
.kz-hero-title{font-size:64px;line-height:1;}
.kz-hero-count{font-size:15px;color:#c9c3b3;font-weight:700;}
.kz-hero-search{padding:14px 18px;font-size:16px;background:rgba(8,7,14,.85);}
.kz-list-tools{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin:-8px 0 -6px;}
.kz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:22px 18px;}
.kz-card{position:relative;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .15s;animation:fadeUp .3s ease both;}
.kz-card:hover{transform:translateY(-4px);}
.kz-card-art{position:relative;aspect-ratio:3/4;border-radius:12px;background:radial-gradient(ellipse at 50% 60%, rgba(255,150,40,.18), transparent 70%);}
.kz-card:hover .kz-card-art{filter:drop-shadow(0 0 14px rgba(255,160,40,.75));}
.kz-card-art img{width:100%;height:100%;object-fit:contain;display:block;}
.kz-fav-btn{
  position:absolute;right:6px;bottom:8px;width:34px;height:34px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.2);background:rgba(8,7,14,.85);color:var(--text-faint);
  font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.kz-fav-btn.on{border-color:#ffc93a;color:#ffc93a;}
.kz-card-body{padding:0 4px;}
.kz-card-name{font-weight:900;font-size:16px;line-height:1.2;color:var(--text-strong);}
.kz-card-meta{font-size:13px;color:var(--text-dim);margin-top:3px;}

/* ======================= PERSONAGENS: FICHA ======================= */
.kz-detail-hero{
  min-height:420px;border-color:rgba(255,150,50,.6);
  box-shadow:0 0 34px rgba(255,120,30,.28), inset 0 0 80px rgba(0,0,0,.6);
  background:
    radial-gradient(ellipse 55% 90% at 72% 45%, rgba(255,190,40,.32), transparent 62%),
    radial-gradient(ellipse 35% 70% at 96% 30%, rgba(160,60,230,.38), transparent 60%),
    radial-gradient(ellipse 40% 60% at 45% 0%, rgba(90,60,200,.25), transparent 60%),
    linear-gradient(180deg,#0e0c1a,#0a0912);
}
.kz-detail-hero .kz-hero-art{width:62%;}
.kz-detail-hero .kz-hero-art-mask{-webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 38%);mask-image:linear-gradient(90deg, transparent 0%, #000 38%);}
.kz-detail-hero .kz-hero-scrim{background:linear-gradient(90deg, rgba(10,9,18,.95) 0%, rgba(10,9,18,.82) 45%, rgba(10,9,18,0) 75%);}
.kz-detail-content{position:relative;padding:26px 30px 30px;display:flex;flex-direction:column;gap:22px;}
.kz-back-btn{
  align-self:flex-start;display:flex;align-items:center;gap:12px;padding:10px 20px;border-radius:8px;
  border:1.5px solid var(--gold);background:rgba(8,7,14,.8);color:var(--text);font-size:15px;font-weight:500;
}
.kz-back-btn:hover{background:#1a1220;}
.kz-hero-nav{position:absolute;right:28px;top:66px;z-index:2;display:flex;gap:8px;align-items:center;}
.kz-hero-navbtn{min-width:40px;height:40px;padding:0 12px;border-radius:10px;border:1.5px solid rgba(255,255,255,.25);background:rgba(8,7,14,.82);color:var(--text);font-size:22px;line-height:1;font-weight:700;}
.kz-hero-navbtn:hover{border-color:var(--gold);color:var(--gold-light);}
.kz-detail-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.kz-step-btn{display:inline-flex;align-items:center;gap:10px;max-width:260px;padding:10px 16px;border-radius:8px;border:1.5px solid rgba(255,255,255,.22);background:rgba(8,7,14,.8);color:var(--text);font-size:14px;font-weight:600;}
.kz-step-btn:hover{border-color:var(--gold);background:#1a1220;}
.kz-step-btn .arr{font-size:20px;line-height:1;color:var(--gold);}
.kz-step-btn .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kz-step-btn .lbl{display:block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);}
.kz-step-btn .col{min-width:0;display:flex;flex-direction:column;align-items:flex-start;}
.kz-step-btn.next .col{align-items:flex-end;text-align:right;}
.kz-back-btn .arr{font-size:18px;}
.kz-detail-main{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap;}
.kz-detail-card{width:270px;flex-shrink:0;aspect-ratio:3/4;position:relative;filter:drop-shadow(0 0 18px rgba(255,190,40,.75)) drop-shadow(0 0 4px rgba(255,220,120,.9));}
.kz-detail-card img{width:100%;height:100%;object-fit:contain;display:block;}
.kz-detail-info{flex:1;min-width:280px;display:flex;flex-direction:column;gap:18px;padding-top:10px;}
.kz-name-band{align-self:flex-start;max-width:100%;padding:4px 70px 12px 16px;background:linear-gradient(90deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.7) 70%, rgba(0,0,0,0) 100%);transform:skewX(-8deg);}
.kz-name-band h1{
  margin:0;transform:skewX(8deg);font-family:'Kaushan Script',cursive;font-weight:400;font-size:clamp(40px, 5.2vw, 74px);line-height:1.05;padding-right:12px;text-wrap:balance;
  background:linear-gradient(180deg,#fff6c8 8%,#ffd23f 48%,#e0820b 92%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #3a1200) drop-shadow(0 0 14px rgba(255,170,40,.45));
}
.kz-pill-row{display:flex;gap:12px;flex-wrap:wrap;}
.kz-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:999px;border:1.5px solid;font-size:16px;font-weight:700;white-space:nowrap;}
.kz-action-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
.kz-build-btn{
  display:flex;align-items:center;gap:14px;padding:13px 26px;border-radius:8px;border:1.5px solid var(--gold);
  background:linear-gradient(180deg,rgba(40,22,8,.92),rgba(16,10,6,.92));color:var(--gold-light);font-size:16px;font-weight:700;
  box-shadow:0 0 16px rgba(255,150,40,.3);
}
.kz-build-btn:hover{filter:brightness(1.2);}
.kz-build-btn .glyph{font-family:'Shippori Mincho',serif;font-weight:800;font-size:20px;color:#ff8a2a;}
.kz-fav-toggle{
  display:flex;align-items:center;gap:10px;padding:13px 22px;border-radius:8px;border:1.5px solid rgba(255,255,255,.25);
  background:rgba(8,7,14,.85);color:#dcd6c6;font-size:16px;font-weight:700;
}
.kz-fav-toggle .star{font-size:18px;}
.kz-fav-toggle.on{border-color:#ffc93a;color:#ffc93a;}
.kz-edit-btn{padding:13px 18px;border-radius:8px;border:1.5px solid rgba(255,255,255,.14);background:rgba(8,7,14,.7);color:var(--text-dim);font-size:14px;font-weight:700;}
.kz-edit-btn:hover{color:var(--text);border-color:rgba(255,170,70,.45);}
.kz-tabs{display:flex;gap:4px;border-bottom:1.5px solid rgba(255,150,50,.35);flex-wrap:wrap;}
.kz-tab{
  display:flex;align-items:center;gap:12px;padding:14px 34px;border:none;border-bottom:4px solid transparent;margin-bottom:-2px;
  border-radius:10px 10px 0 0;background:rgba(14,12,22,.8);color:var(--text-dim);font-size:16px;font-weight:700;
}
.kz-tab .glyph{font-family:'Shippori Mincho',serif;font-weight:800;font-size:22px;color:var(--text-faint);}
.kz-tab:hover{color:var(--text);}
.kz-tab.active{background:linear-gradient(180deg, rgba(255,110,20,.28), rgba(255,110,20,.04));border-bottom-color:#ff7a1a;color:var(--text-strong);}
.kz-tab.active .glyph{color:#ff8a2a;}
.kz-tabpanel{
  border-radius:14px;border:1.5px solid rgba(255,150,50,.5);background:linear-gradient(180deg,rgba(18,14,24,.92),rgba(10,9,16,.95));
  box-shadow:0 0 26px rgba(255,120,30,.15);padding:26px 28px 30px;display:flex;flex-direction:column;gap:24px;animation:fadeUp .2s ease both;
}
.kz-panel-head{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:2px solid;border-image:linear-gradient(90deg,#ff7a1a,#ffb13b 30%,rgba(255,150,50,0) 80%) 1;}
.kz-panel-glyph{font-family:'Shippori Mincho',serif;font-weight:800;font-size:34px;color:#ff7a1a;text-shadow:0 0 14px rgba(255,120,30,.7);}
.kz-panel-title{margin:0;font-family:'Kaushan Script',cursive;font-weight:400;font-size:42px;color:var(--text-strong);text-shadow:0 3px 0 #3a1200, 0 0 16px rgba(255,140,30,.5);}
.kz-ab-groups{display:flex;flex-direction:column;gap:28px;}
.kz-ab-group{display:flex;flex-direction:column;gap:12px;}
.kz-ab-group-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.kz-ab-group-title{font-size:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
.kz-ab-effects{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dim);}
.kz-ab-row{display:flex;gap:18px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid var(--line-soft);background:rgba(20,20,34,.6);}
.kz-ab-row.nodata{opacity:.6;}
.kz-ab-icon{
  width:64px;height:64px;flex-shrink:0;border-radius:10px;border:1.5px solid rgba(140,150,190,.45);
  background:linear-gradient(180deg,#141828,#0b0d16);display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:#6d7592;overflow:hidden;
}
.kz-ab-icon img{width:100%;height:100%;object-fit:cover;}
.kz-ab-icon.has-img{background:none;border:0;border-radius:50%;overflow:visible;}
.kz-ab-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.kz-ab-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.kz-ab-meta .kz-stars{font-size:20px;}
.kz-ab-tipo{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.kz-ab-req{font-size:12px;color:var(--text-muted);}
.kz-ab-dano{font-family:'JetBrains Mono',monospace;font-size:12px;padding:2px 8px;border-radius:6px;background:rgba(255,120,30,.14);color:#ffb070;border:1px solid rgba(255,120,30,.35);}
.kz-ab-name{font-size:17px;font-weight:900;color:var(--text-strong);}
.kz-ab-desc{font-size:14px;line-height:1.6;color:var(--text-soft);text-wrap:pretty;white-space:pre-line;}
.kz-supremo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.kz-supremo-card{padding:14px 16px;border-radius:12px;border:1px solid var(--line-soft);background:rgba(20,20,34,.6);display:flex;gap:14px;align-items:flex-start;}
.kz-supremo-card .ico{width:52px;height:52px;flex-shrink:0;}
.kz-supremo-card .ico img{width:100%;height:100%;object-fit:cover;display:block;}
.kz-supremo-card .t{min-width:0;display:flex;flex-direction:column;gap:4px;}
.kz-supremo-card .n{font-size:15px;font-weight:900;color:var(--text-strong);}
.kz-supremo-card .d{font-size:14px;line-height:1.55;color:var(--text-soft);text-wrap:pretty;}
.kz-empty-ball{display:flex;align-items:center;gap:22px;padding:30px 10px;}
.kz-empty-ball img{width:84px;height:84px;flex-shrink:0;display:block;filter:drop-shadow(0 0 21px rgba(255,140,30,.55));}
.kz-empty-ball div{font-size:16px;color:var(--text-soft);line-height:1.6;}
/* comida de afinidade e vínculos (quando já tiver dado capturado) */
.cdp-food-row{display:flex;gap:18px;flex-wrap:wrap;}
.cdp-food-item{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;text-align:center;}
.cdp-food-icon{
  width:76px;height:76px;border-radius:12px;border:2px solid rgba(140,150,190,.45);background:linear-gradient(180deg,#141828,#0b0d16);
  display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--text-faint);flex-shrink:0;
}
.cdp-food-icon.rarity-azul{border-color:#3b82c4;box-shadow:0 0 12px rgba(59,130,196,.35);}
.cdp-food-icon.rarity-roxo{border-color:#8b5fbf;box-shadow:0 0 12px rgba(139,95,191,.35);}
.cdp-food-icon.rarity-dourado{border-color:var(--gold);box-shadow:0 0 12px rgba(255,177,59,.35);}
.cdp-food-name{font-size:13px;color:var(--text-soft);line-height:1.3;font-weight:700;}
.cdp-bond-list{display:flex;flex-direction:column;gap:12px;}
.cdp-bond-row{display:flex;gap:16px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid var(--line-soft);background:rgba(20,20,34,.6);}
.cdp-bond-partner{display:flex;align-items:center;flex-shrink:0;}
.cdp-bond-avatar{width:52px;aspect-ratio:3/4;border-radius:8px;overflow:hidden;flex-shrink:0;position:relative;}
.cdp-bond-avatar img{width:100%;height:100%;object-fit:contain;display:block;}
.cdp-bond-avatar .avatar-fallback{font-size:14px;border-radius:8px;}
.cdp-bond-avatar + .cdp-bond-avatar{margin-left:-8px;}
.cdp-bond-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.cdp-bond-bonus{font-size:13px;font-weight:900;color:#7cd29f;}
.cdp-bond-skill{font-size:16px;font-weight:900;color:var(--text-strong);}
.cdp-bond-skill .inactive-tag{font-size:11px;color:var(--text-faint);font-weight:700;margin-left:8px;text-transform:uppercase;letter-spacing:.5px;}
.cdp-bond-req{font-size:13px;color:var(--text-dim);}

/* ======================= COLEÇÃO ======================= */
.kz-coll-counter{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:12px;border:1.5px solid rgba(255,150,50,.5);background:var(--panel);}
.kz-coll-balls{display:flex;gap:3px;}
.kz-coll-balls img{width:30px;height:30px;display:block;}
.kz-coll-balls img.off{filter:grayscale(1) brightness(.35);}
.kz-coll-balls img.on{filter:drop-shadow(0 0 6px rgba(255,140,30,.7));}
.kz-coll-summary{font-size:16px;font-weight:900;color:var(--text-strong);white-space:nowrap;}
.kz-filter-panel{display:flex;flex-direction:column;gap:12px;padding:18px 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);}
.kz-filter-top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.kz-filter-top .kz-input{flex:1;min-width:200px;}
.kz-owned-toggle{
  display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);
  background:rgba(8,7,14,.75);color:#dcd6c6;font-size:14px;font-weight:700;
}
.kz-owned-toggle .box{width:18px;height:18px;border-radius:5px;border:1.5px solid rgba(255,255,255,.2);color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;}
.kz-owned-toggle.on{border-color:var(--gold);background:rgba(255,120,30,.14);color:var(--gold-light);}
.kz-owned-toggle.on .box{border-color:var(--gold);background:#e0461a;}
.kz-coll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;}
.kz-coll-card{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1.5px solid rgba(120,130,170,.25);background:linear-gradient(180deg,#14101e,#0b0a12);animation:fadeUp .3s ease both;}
.kz-coll-card.owned{border-color:rgba(255,150,50,.55);box-shadow:0 0 18px rgba(255,120,30,.2);}
.kz-coll-card.owned.blue{border-color:rgba(79,184,255,.6);box-shadow:0 0 20px rgba(79,184,255,.25);}
.kz-coll-art{position:relative;aspect-ratio:3/4;background:radial-gradient(ellipse at 50% 60%, rgba(255,150,40,.16), transparent 70%);}
.kz-coll-card.owned .kz-coll-art{cursor:pointer;}
.kz-coll-art img{width:100%;height:100%;object-fit:contain;display:block;}
.kz-coll-card:not(.owned) .kz-coll-art img,
.kz-coll-card:not(.owned) .kz-coll-art .avatar-fallback{filter:grayscale(1) brightness(.5);}
.kz-coll-seal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.kz-coll-seal span{
  width:64px;height:64px;border-radius:50%;background:rgba(8,7,14,.82);border:1.5px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho',serif;font-weight:800;font-size:30px;color:var(--text-muted);
}
.kz-coll-stars{
  position:absolute;left:0;right:0;bottom:0;padding:26px 10px 10px;cursor:default;
  background:linear-gradient(0deg, rgba(0,0,0,.92) 40%, rgba(0,0,0,.5) 78%, transparent);
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.kz-star-btns{display:flex;gap:2px;}
.kz-star-btn{
  padding:0 1px;border:none;background:none;font-size:28px;line-height:1;color:var(--text-faint);
  text-shadow:0 2px 2px #000;transition:transform .12s, color .5s ease, text-shadow .5s ease;
}
.kz-star-btn:hover{transform:scale(1.15);}
.kz-star-btn.gold{color:#ffc93a;text-shadow:0 0 8px rgba(255,190,50,.7), 0 2px 2px #000;}
.kz-star-btn.blue{color:var(--awaken-blue);text-shadow:0 0 8px rgba(79,184,255,.7), 0 2px 2px #000;}
.kz-coll-stars.awakening{animation:awakenFlicker .5s ease;}
.kz-coll-stars.awakening .kz-star-btn{color:var(--awaken-blue);text-shadow:0 0 8px rgba(79,184,255,.7), 0 2px 2px #000;}
.kz-phase-row{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;flex-wrap:wrap;}
.kz-phase-label{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gold-light);}
.kz-phase-label.blue{color:#7cc8ff;}
.kz-awaken-btn{
  padding:5px 14px;border-radius:8px;border:1.5px solid #c98a10;background:linear-gradient(180deg,#3a2f14,#1c1608);
  color:#ffd23f;font-family:'Shippori Mincho',serif;font-weight:800;font-size:14px;letter-spacing:3px;box-shadow:0 0 14px rgba(255,190,50,.45);
}
.kz-awaken-btn:hover{filter:brightness(1.2);}
.kz-awaken-btn:disabled{opacity:.6;cursor:default;}
.kz-gold-back-btn{padding:3px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:none;color:var(--text-dim);font-size:11px;font-weight:700;}
.kz-coll-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1;}
.kz-coll-name{font-weight:900;font-size:16px;line-height:1.2;color:var(--text-strong);}
.kz-coll-card:not(.owned) .kz-coll-name{color:var(--text-muted);}
.kz-coll-actions{display:flex;flex-direction:column;gap:8px;margin-top:auto;}
.kz-see-ab-btn{
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:8px;
  border:1px solid rgba(255,170,70,.35);background:rgba(255,120,30,.08);color:var(--gold-light);font-size:13px;font-weight:700;
}
.kz-see-ab-btn:hover{background:rgba(255,120,30,.16);}
.kz-remove-btn{padding:6px 0;border:none;background:none;color:var(--danger);font-size:13px;font-weight:700;text-align:left;}
.kz-acquire-btn{
  margin-top:auto;padding:10px 0;border-radius:8px;border:1.5px solid var(--gold);background:var(--grad-primary);
  color:#fff;font-size:14px;font-weight:700;box-shadow:0 0 14px rgba(255,90,30,.35);
}
.kz-acquire-btn:hover{filter:brightness(1.1);}

/* popup de habilidades por nível (Coleção) */
.kz-popup{max-width:680px!important;}
.kz-popup-head{
  position:relative;display:flex;align-items:center;gap:16px;padding:18px 20px;border-bottom:1.5px solid rgba(255,150,50,.35);
  background:radial-gradient(ellipse 60% 120% at 90% 50%, rgba(255,170,40,.2), transparent 70%);
}
.kz-popup-art{width:62px;height:84px;flex-shrink:0;position:relative;}
.kz-popup-art img{width:100%;height:100%;object-fit:contain;display:block;}
.kz-popup-art .avatar-fallback{font-size:18px;border-radius:8px;}
.kz-popup-title{flex:1;min-width:0;}
.kz-popup-name{font-family:'Kaushan Script',cursive;font-size:32px;line-height:1.1;color:var(--text-strong);text-shadow:0 3px 0 #3a1200;}
.kz-popup-level{display:flex;align-items:center;gap:10px;margin-top:4px;}
.kz-popup-level .kz-stars{font-size:18px;}
.kz-popup-level span.lbl{font-size:13px;color:var(--text-dim);}
.kz-close-btn{width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(8,7,14,.8);color:var(--text);font-size:15px;flex-shrink:0;}
.kz-close-btn:hover{border-color:var(--gold);}
.kz-popup-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:16px;}
.kz-popup-group{border-radius:12px;border:1px solid rgba(120,130,170,.25);background:rgba(20,20,34,.6);padding:12px 14px;display:flex;flex-direction:column;gap:12px;}
.kz-popup-row{display:flex;flex-direction:column;gap:3px;}
.kz-popup-row.locked{opacity:.55;}
.kz-popup-row-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.kz-popup-row-head .kz-stars{font-size:16px;}
.kz-popup-row .tipo{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.kz-locked-tag{padding:2px 8px;border-radius:999px;background:rgba(179,64,47,.18);border:1px solid rgba(214,90,68,.5);color:#ef8b7f;font-size:11px;font-weight:700;}
.kz-popup-row .nm{font-size:15px;font-weight:900;color:var(--text-strong);}
.kz-popup-row .ds{font-size:13px;line-height:1.55;color:var(--text-soft);text-wrap:pretty;white-space:pre-line;}

/* ======================= COMBOS ======================= */
.kz-formations{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.kz-formations .kz-label{font-size:12px;letter-spacing:1px;font-weight:700;}
.kz-formation-pill{display:inline-flex;align-items:center;border-radius:999px;border:1.5px solid rgba(255,170,70,.45);background:rgba(20,14,10,.8);overflow:hidden;}
.kz-formation-pill .load{padding:6px 14px;border:none;background:none;color:var(--gold-light);font-size:14px;font-weight:700;}
.kz-formation-pill .del{padding:6px 12px 6px 4px;border:none;background:none;color:var(--text-muted);font-size:13px;}
.kz-formation-pill .del:hover{color:var(--danger);}
.kz-combos-layout{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:22px;align-items:start;}
.kz-roster{padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:16px;max-height:calc(100vh - 32px);}
.kz-roster-head{display:flex;align-items:center;justify-content:space-between;}
.kz-roster-hint{font-size:13px;color:var(--text-muted);}
.kz-roster .kz-input{padding:10px 14px;font-size:14px;border-radius:8px;border-color:rgba(255,170,70,.4);}
.kz-roster-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;overflow-y:auto;overflow-x:hidden;padding-right:4px;}
.kz-roster-item{position:relative;cursor:pointer;display:flex;flex-direction:column;gap:4px;}
.kz-roster-item:hover{filter:drop-shadow(0 0 8px rgba(255,160,40,.8));}
.kz-roster-item.placed{opacity:.55;}
.kz-roster-item.dragging{opacity:.35;}
.kz-roster-art{width:100%;aspect-ratio:3/4;position:relative;}
.kz-roster-art img{width:100%;height:100%;object-fit:contain;display:block;}
.kz-roster-art .avatar-fallback{font-size:18px;border-radius:8px;}
.kz-roster-name{font-size:11px;font-weight:700;line-height:1.2;color:#dcd6c6;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kz-roster-casa{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);padding:3px 8px;border-radius:6px;background:#d8361a;color:#fff;font-size:11px;font-weight:900;white-space:nowrap;}
.kz-combos-main{display:flex;flex-direction:column;gap:22px;min-width:0;}
.kz-field{
  border-radius:16px;border:1.5px solid rgba(255,150,50,.55);box-shadow:0 0 30px rgba(255,120,30,.18);
  background:radial-gradient(ellipse 70% 80% at 50% 110%, rgba(255,120,30,.22), transparent 60%), linear-gradient(180deg,#120e1c,#0a0912);
  padding:20px 22px 24px;display:flex;flex-direction:column;gap:16px;
}
.kz-field-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.kz-slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.kz-slot{
  position:relative;min-height:120px;border-radius:12px;border:2px dashed rgba(140,150,190,.35);background:rgba(16,14,26,.85);
  cursor:pointer;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:12px;padding:10px 40px 10px 46px;
  transition:filter .12s;
}
.kz-slot:hover{filter:brightness(1.12);}
.kz-slot.filled{border-style:solid;}
.kz-slot.selected{border-color:var(--gold-light);border-style:solid;box-shadow:0 0 22px rgba(255,210,100,.6);}
.kz-slot.dragging{opacity:.35;}
.kz-slot.drag-over{border-color:var(--gold-light);border-style:solid;}
.kz-slot-ball{position:absolute;left:6px;top:6px;width:34px;height:34px;z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));}
.kz-slot-remove{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(8,7,14,.85);color:var(--text);font-size:13px;z-index:2;}
.kz-slot-remove:hover{border-color:var(--danger);color:var(--danger);}
.kz-slot-art{width:74px;aspect-ratio:3/4;flex-shrink:0;position:relative;}
.kz-slot-art img{width:100%;height:100%;object-fit:contain;display:block;}
.kz-slot-art .avatar-fallback{font-size:18px;border-radius:8px;}
.kz-slot-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
.kz-slot-name{font-size:14px;font-weight:900;color:var(--text-strong);line-height:1.2;}
.kz-slot.filled{flex-wrap:wrap;row-gap:8px;}
.kz-slot-eff{flex-basis:100%;display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-start;padding-top:8px;border-top:1px dashed rgba(255,255,255,.12);}
.kz-slot-eff .col{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
.kz-slot-eff .lbl{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint);}
.kz-slot-eff .pills{display:flex;gap:4px;flex-wrap:wrap;}
.kz-slot-eff .kz-eff-pill{padding:2px 9px;font-size:11px;}
.kz-slot-eff .none{font-size:11px;color:var(--text-faint);}
.kz-slot-plus{font-size:40px;line-height:1;color:var(--gold);opacity:.7;}
.kz-slot-hint{font-size:13px;color:var(--text-dim);text-align:center;}
.kz-sim-modal{max-width:900px!important;}
.kz-sim-modal .modal-body{max-height:78vh;}
.kz-rec{display:flex;flex-direction:column;gap:12px;margin-top:6px;padding-top:18px;border-top:1.5px solid rgba(255,150,50,.3);}
.kz-rec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.kz-rec-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 4px;}
.kz-rec-head h3{margin:0;font-family:'Kaushan Script',cursive;font-weight:400;font-size:28px;color:var(--text-strong);text-shadow:0 3px 0 #3a1200;}
.kz-rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.kz-rec-card{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;border:1.5px solid rgba(255,150,50,.3);background:rgba(16,14,26,.85);}
.kz-rec-card.top{border-color:var(--gold);box-shadow:0 0 16px rgba(255,120,30,.3);}
.kz-rec-top{display:flex;gap:12px;align-items:center;}
.kz-rec-art{width:54px;aspect-ratio:3/4;flex-shrink:0;position:relative;}
.kz-rec-art img{width:100%;height:100%;object-fit:contain;display:block;}
.kz-rec-art .avatar-fallback{font-size:13px;border-radius:6px;}
.kz-rec-name{font-size:15px;font-weight:900;color:var(--text-strong);line-height:1.2;}
.kz-rec-gain{display:inline-block;margin-top:3px;padding:2px 9px;border-radius:999px;background:#2f9e4f;color:#fff;font-size:11px;font-weight:900;}
.kz-rec-eff{display:flex;gap:14px;flex-wrap:wrap;}
.kz-rec-eff .kz-atk-effline{align-items:flex-start;margin-top:0;}
.kz-rec-chain{font-size:12.5px;line-height:1.5;color:var(--text-dim);}
.kz-rec-chain b{color:var(--text);}
.kz-rec-chain .arr{color:#ff8a2a;margin:0 4px;}
.kz-rec-card .kz-btn{align-self:flex-start;}
.kz-field-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.kz-combo-count{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:10px 0 2px;padding:9px 14px;border-radius:10px;background:rgba(8,7,14,.6);border:1px solid rgba(255,255,255,.14);}
.kz-combo-count .big{font-size:17px;font-weight:800;color:#f0e2bd;}
.kz-combo-count .big b{font-size:24px;color:#ffd66b;margin-right:2px;}
.kz-combo-count .max{font-size:14px;font-weight:700;color:#a79f8c;}
.kz-combo-count .sub{font-size:13px;color:#cfc8b8;}
.kz-combo-count .sub b{color:#f0e2bd;}
.kz-combo-count.none{color:#cfc8b8;}
.kz-combo-count.none b{color:#e8806c;font-size:20px;}
.kz-opt-btn{border-color:rgba(201,162,75,.6);color:#f0d9a0;}
.kz-opt-btn:disabled{opacity:.45;cursor:not-allowed;}
.kz-opt-info{margin:8px 0 2px;padding:9px 12px;border-radius:10px;background:rgba(201,162,75,.1);border:1px solid rgba(201,162,75,.35);font-size:13px;line-height:1.5;color:#f0e2bd;}
.kz-opt-info b{color:#ffd66b;}
.kz-sim-open{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;font-size:16px;}
.kz-sim-open .glyph{font-family:'Shippori Mincho',serif;font-weight:800;font-size:20px;}
.kz-sim-open .cnt{padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.28);font-size:12px;font-weight:800;}
.kz-sim{padding:20px 22px 24px;display:flex;flex-direction:column;gap:18px;}
.kz-sim-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.kz-sim-head .glyph{font-family:'Shippori Mincho',serif;font-weight:800;font-size:30px;color:#ff7a1a;text-shadow:0 0 14px rgba(255,120,30,.7);}
.kz-sim-head h2{margin:0;font-family:'Kaushan Script',cursive;font-weight:400;font-size:36px;color:var(--text-strong);text-shadow:0 3px 0 #3a1200;white-space:nowrap;}
/* Roleta de 6 personagens do time (escolhe quem inspecionar) */
.kz-sim-roster{display:flex;flex-wrap:wrap;gap:10px;}
.kz-sim-char{
  display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;padding:8px 4px;border-radius:10px;
  border:1.5px solid rgba(255,255,255,.14);background:rgba(16,14,26,.85);
}
.kz-sim-char:hover{border-color:rgba(255,170,70,.5);}
.kz-sim-char.active{border-color:var(--gold);background:linear-gradient(180deg, rgba(255,110,20,.3), rgba(255,110,20,.08));box-shadow:0 0 14px rgba(255,120,30,.3);}
.kz-sim-char-art{width:52px;aspect-ratio:3/4;position:relative;}
.kz-sim-char-art img{width:100%;height:100%;object-fit:contain;display:block;}
.kz-sim-char-art .avatar-fallback{font-size:12px;border-radius:6px;}
.kz-sim-char-name{font-size:11px;font-weight:700;color:var(--text);text-align:center;line-height:1.2;}

/* Detalhe do Ataque Comb. — igual ao pop-up do jogo: a habilidade/suprema escolhida à
   esquerda, e quem no time reage a ela (com o de menor casa marcado como prioridade),
   mais a cadeia completa que realmente aconteceria a partir daqui. */
.kz-atk-section{display:flex;flex-direction:column;gap:10px;}
.kz-atk-row{display:flex;flex-wrap:wrap;gap:10px;}
.kz-atk-card{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:104px;padding:10px 8px;border-radius:12px;
  border:1.5px solid rgba(255,150,50,.35);background:rgba(16,14,26,.85);text-align:center;
}
.kz-atk-card.start{border-color:var(--gold);background:linear-gradient(180deg, rgba(255,110,20,.28), rgba(16,14,26,.85));box-shadow:0 0 16px rgba(255,120,30,.3);}
.kz-atk-card.priority{border-color:#6fd66f;box-shadow:0 0 14px rgba(90,220,90,.35);}
.kz-atk-priority-tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);padding:2px 8px;border-radius:999px;background:#2f9e4f;color:#fff;font-size:9px;font-weight:900;white-space:nowrap;box-shadow:0 0 8px rgba(50,180,80,.6);}
.kz-atk-art{width:58px;aspect-ratio:3/4;position:relative;}
.kz-atk-art img{width:100%;height:100%;object-fit:contain;display:block;}
.kz-atk-art .avatar-fallback{font-size:13px;border-radius:6px;}
.kz-atk-name{font-size:12px;font-weight:900;color:var(--text-strong);line-height:1.2;}
.kz-atk-kind{font-size:11px;color:var(--text-dim);}
.kz-atk-effline{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:2px;}
.kz-atk-effline .lbl{font-size:9px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--text-faint);}

.kz-atk-chain-wrap{display:flex;flex-direction:column;gap:8px;padding-top:4px;border-top:1px dashed rgba(255,255,255,.12);}
.kz-atk-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
.kz-atk-chain-arrow{color:#ff8a2a;font-size:15px;flex-shrink:0;}
.kz-atk-chain-step{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 6px;border-radius:14px;border:1px solid rgba(255,150,50,.3);background:rgba(16,14,26,.85);}
.kz-atk-chain-info{display:flex;flex-direction:column;align-items:flex-start;gap:2px;}
.kz-atk-chain-step .nm{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;}
.kz-atk-chain-step .kz-atk-effline{align-items:flex-start;margin-top:0;}
.kz-atk-chain-art{width:28px;height:38px;flex-shrink:0;position:relative;border-radius:6px;overflow:hidden;}
.kz-atk-chain-art img{width:100%;height:100%;object-fit:contain;display:block;}
.kz-atk-chain-art .avatar-fallback{font-size:9px;}

/* ======================= TIER LIST ======================= */
.kz-tier-rows{border-radius:14px;overflow:hidden;border:1.5px solid rgba(255,150,50,.5);box-shadow:0 0 26px rgba(255,120,30,.15);display:flex;flex-direction:column;}
.tier-row{display:flex;align-items:stretch;background:rgba(14,12,22,.92);border-bottom:1px solid rgba(255,150,50,.25);}
.tier-row:last-child{border-bottom:none;}
.tier-label{
  width:130px;flex-shrink:0;display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:'Kaushan Script',cursive;font-weight:400;font-size:46px;line-height:1.1;color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.35);padding:8px 10px;overflow-wrap:normal;word-break:normal;hyphens:none;cursor:text;outline:none;overflow:hidden;
}
.tier-label:focus{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);}
.tier-items{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;padding:12px;min-height:124px;transition:background .12s;}
.tier-items.drag-over,.tier-pool-items.drag-over{background:rgba(255,150,40,.12);}
.tier-ctrl{flex-shrink:0;width:38px;display:flex;flex-direction:column;border-left:1px solid rgba(255,150,50,.25);}
.tier-ctrl > *{flex:1;display:flex;align-items:center;justify-content:center;min-height:28px;border:none;border-top:1px solid rgba(255,150,50,.12);background:transparent;color:var(--text-faint);font-size:14px;transition:color .12s,background .12s;}
.tier-ctrl > *:first-child{border-top:none;}
.tier-handle{cursor:grab;font-size:18px;letter-spacing:-2px;user-select:none;}
.tier-handle:active{cursor:grabbing;}
.tier-handle:hover,.tier-move-btn:hover{color:var(--gold-light);background:rgba(255,150,40,.12);}
.tier-move-btn:disabled{opacity:.25;cursor:default;pointer-events:none;}
.tier-row.row-dragging{opacity:.4;}
.tier-row.drop-before{box-shadow:inset 0 4px 0 var(--gold-light);}
.tier-row.drop-after{box-shadow:inset 0 -4px 0 var(--gold-light);}
.tier-remove-btn{flex-shrink:0;border:none;background:transparent;color:var(--text-faint);font-size:15px;transition:color .12s,background .12s;}
.tier-remove-btn:hover{color:#ff6a2a;background:rgba(216,54,26,.12);}
.tier-pool{border-radius:14px;border:1.5px dashed rgba(255,170,70,.45);padding:16px;background:rgba(10,9,16,.8);display:flex;flex-direction:column;gap:12px;}
.tier-pool-items{display:flex;flex-wrap:wrap;gap:10px;min-height:110px;border-radius:8px;transition:background .12s;}
.tier-item{width:76px;aspect-ratio:3/4;flex-shrink:0;position:relative;cursor:grab;transition:filter .12s,opacity .12s;}
.tier-item:hover{filter:drop-shadow(0 0 8px rgba(255,160,40,.85));}
.tier-item.dragging{opacity:.35;}
.tier-item img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;}
.tier-item .avatar-fallback{font-size:20px;border-radius:8px;pointer-events:none;}

/* ======================= GUIAS ======================= */
.kz-guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:22px;}
.kz-guide-card{border-radius:14px;border:1.5px solid rgba(255,150,50,.5);background:linear-gradient(180deg,rgba(18,14,24,.92),rgba(10,9,16,.95));padding:22px 24px;display:flex;flex-direction:column;gap:14px;}
.kz-guide-head{display:flex;align-items:center;gap:12px;}
.kz-guide-head .glyph{font-family:'Shippori Mincho',serif;font-weight:800;font-size:30px;color:#ff7a1a;}
.kz-guide-head h2{margin:0;font-family:'Kaushan Script',cursive;font-weight:400;font-size:32px;color:var(--text-strong);}
.kz-guide-card p{margin:0;font-size:15px;line-height:1.65;color:var(--text-soft);text-wrap:pretty;}
.kz-guide-effects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.kz-guide-eff{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:rgba(20,20,34,.7);border:1px solid var(--line-soft);}
.kz-guide-eff .kz-eff-dot{width:34px;height:34px;font-size:12px;}
.kz-guide-eff .txt{display:flex;flex-direction:column;}
.kz-guide-eff .n{font-size:15px;font-weight:900;color:var(--text-strong);}
.kz-guide-eff .c{font-size:12px;color:var(--text-dim);}
.kz-guide-formation{display:flex;flex-direction:column;gap:8px;}
.kz-guide-slots{display:grid;grid-template-columns:repeat(2,72px);gap:8px;}
.kz-guide-slots .cell{padding:12px 0;border-radius:10px;text-align:center;font-weight:900;background:rgba(20,20,34,.8);border:1px solid rgba(120,130,170,.3);color:var(--text-soft);}
.kz-guide-note{font-size:13px;color:var(--text-dim);}
.kz-guide-prog{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid var(--line-soft);}
.kz-guide-prog-row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;padding:9px 14px;background:rgba(20,20,34,.85);}
.kz-guide-prog-row:nth-child(even){background:rgba(20,20,34,.5);}
.kz-guide-prog-row .kz-stars{font-size:16px;}
.kz-guide-prog-row .t{font-size:14px;color:#dcd6c6;}
.kz-guide-stat{display:flex;flex-direction:column;gap:8px;}
.kz-guide-stat .kz-pill{font-size:15px;padding:8px 16px;gap:10px;}
.kz-guide-stat .count{font-family:'JetBrains Mono',monospace;font-size:13px;opacity:.8;}

/* ======================= FAVORITOS ======================= */
.kz-fav-empty{display:flex;align-items:center;gap:24px;padding:40px 30px;border-radius:14px;border:1.5px dashed rgba(255,170,70,.45);background:rgba(10,9,16,.8);}
.kz-fav-empty img{width:96px;height:96px;flex-shrink:0;display:block;filter:drop-shadow(0 0 24px rgba(255,140,30,.55));}
.kz-fav-empty .txt{display:flex;flex-direction:column;gap:10px;}
.kz-fav-empty .t1{font-size:18px;font-weight:900;color:var(--text-strong);}
.kz-fav-empty .t2{font-size:15px;color:var(--text-dim);}

/* ======================= DOAR ======================= */
.kz-donate-layout{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:22px;align-items:start;}
.kz-donate-card{padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}
.kz-donate-card img{width:100%;max-width:220px;border-radius:12px;display:block;background:#fff;padding:10px;}
/* O embed da LivePix vem com uma faixa de texto em cima e embaixo do QR (fixas, 220x280) —
   corta essas faixas escondendo o iframe atrás de uma janela do tamanho só do QR (220x220)
   e deslocando ele pra cima, em vez de mostrar o widget inteiro. */
.kz-qr-crop{width:100%;max-width:220px;height:220px;overflow:hidden;border-radius:12px;position:relative;background:#fff;}
.kz-qr-crop iframe{position:absolute;top:-24px;left:0;width:100%;height:280px;border:none;}
.kz-donate-cta{
  display:flex;align-items:center;gap:10px;padding:13px 26px;border-radius:8px;border:1.5px solid var(--gold);
  background:var(--grad-primary);color:#fff;font-size:16px;font-weight:700;box-shadow:0 0 16px rgba(255,90,30,.4);width:100%;justify-content:center;
}
.kz-donate-cta:hover{filter:brightness(1.1);}
.kz-donate-note{font-size:12.5px;color:var(--text-dim);line-height:1.6;}
.kz-donor-list{display:flex;flex-direction:column;gap:14px;padding:18px 20px;}
.kz-donor-list-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.kz-donor-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;}
.kz-donor-avatar .avatar-fallback{border-radius:50%;font-size:14px;}
.kz-donor-name{font-weight:800;color:var(--text-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.kz-donor-admin{border-top:1.5px dashed rgba(255,150,50,.3);margin-top:6px;padding-top:16px;display:flex;flex-direction:column;gap:10px;}
.kz-donor-admin-row{display:flex;gap:8px;flex-wrap:wrap;}
.kz-donor-admin-row input{flex:1;min-width:120px;}
.kz-donor-admin-row input[type=number]{max-width:130px;}

/* ---- Patentes (faixas por apoio acumulado) — cor vem de --pc/--pctx, setadas por .patente-<key> ---- */
.patente-terraqueo{--pc:91,127,166;--pctx:#9fb0c7;}
.patente-guerreiro_z{--pc:217,123,42;--pctx:#f0a868;}
.patente-ssj{--pc:255,210,63;--pctx:#ffe9a8;}
.patente-ssj2{--pc:255,233,122;--pctx:#fff3c4;}
.patente-deus_ssj{--pc:224,64,31;--pctx:#ff9a8a;}
.patente-ultra_instinto{--pc:140,180,255;--pctx:#d7e6ff;}
.kz-patente-badge{
  display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.4px;border:1px solid rgba(var(--pc,120,130,170),.7);
  color:var(--pctx,#c2c4cf);background:rgba(var(--pc,120,130,170),.16);white-space:nowrap;
}
.kz-patente-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
.kz-patente-card{
  display:flex;flex-direction:column;gap:6px;padding:16px 14px;border-radius:12px;background:rgba(20,20,34,.6);
  border:1.5px solid rgba(var(--pc,120,130,170),.5);
}
.kz-patente-name{font-weight:900;font-size:15px;color:var(--pctx,var(--text-strong));}
.kz-patente-desc{font-size:12.5px;color:var(--text-dim);line-height:1.5;flex:1;}
.kz-patente-min{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text-faint);}

/* ---- Trilha de Honra (contribuição sem dinheiro) ---- */
.kz-honra-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
.kz-honra-card{display:flex;flex-direction:column;gap:6px;padding:16px 14px;border-radius:12px;border:1.5px solid var(--line-soft);background:rgba(20,20,34,.6);}
.kz-honra-card .glyph{font-family:'Shippori Mincho',serif;font-size:26px;color:var(--gold);}
.kz-honra-name{font-weight:900;font-size:14px;color:var(--text-strong);}
.kz-honra-desc{font-size:12.5px;color:var(--text-dim);line-height:1.5;}
.kz-honra-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,177,59,.14);border:1px solid rgba(255,177,59,.4);font-size:12px;font-weight:700;color:var(--gold-light);}
.kz-honra-badge .glyph{font-family:'Shippori Mincho',serif;}
.kz-mini-honra{font-family:'Shippori Mincho',serif;font-size:13px;color:var(--gold);}
.kz-donor-honras{display:flex;gap:2px;}

  padding:16px 14px 14px;position:relative;
}
.kz-dw-toggle{
  position:absolute;left:-18px;top:50%;transform:translateY(-50%);width:26px;height:52px;border-radius:10px 0 0 10px;
  border:1.5px solid rgba(255,150,50,.55);border-right:none;background:linear-gradient(180deg,#1a1220,#0e0c14);

.kz-dw-sub{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:700;}

<!--
  ======================= SUPABASE + DISCORD (login único do site inteiro) =======================
  Um só login (Discord) cobre duas coisas: (1) a Aliança Z — ranking público de apoiadores
  (aba Doar) — e (2) sincronizar os dados pessoais de quem entrar (personagens, equipe,
  Coleção, tier list, favoritos) entre aparelhos. Sem isso preenchido, tudo fica só neste
  navegador, como já era — o botão "Entrar com Discord" some sozinho.
    1. Crie um projeto grátis em https://supabase.com -> "New project" (anote a senha do
       banco, mas não vai precisar usar ela de novo aqui).
    2. Menu lateral: Authentication > Sign In / Providers > ative "Discord". O Supabase
       mostra uma "Redirect URL" (algo como https://SEU-PROJETO.supabase.co/auth/v1/callback) —
       guarde ela.
    3. Crie um app em https://discord.com/developers/applications -> "New Application".
       Na aba OAuth2 > General: copie "Client ID" e "Client Secret". Em OAuth2 > Redirects,
       adicione a Redirect URL do passo 2. Cole Client ID/Secret de volta no Supabase e salve.
    4. Menu lateral do Supabase: SQL Editor > New query > cole e rode (cria as duas tabelas —
       "donations" é pública pra leitura, pra todo visitante ver a Aliança Z; "user_data" é
       privada, cada usuário só vê/mexe nos próprios dados):
         create table public.donations (
           id uuid primary key default gen_random_uuid(),
           number integer not null,
           name text not null,
           amount numeric not null default 0,
           quote text, discord text, link text,
           honras text[] not null default '{}',
           active boolean not null default true,
           created_at timestamptz not null default now()
         );
         alter table public.donations enable row level security;
         create policy "leitura publica" on public.donations for select using (true);

         create table public.user_data (
           user_id uuid not null references auth.users(id) on delete cascade,
           key text not null,
           value text not null,
           updated_at timestamptz not null default now(),
           primary key (user_id, key)
         );
         alter table public.user_data enable row level security;
         create policy "cada um so mexe no proprio" on public.user_data
           for all using (auth.uid() = user_id) with check (auth.uid() = user_id);
    5. Menu lateral: Project Settings > API > copie "Project URL" e a chave "anon public".
       Cole nos dois campos do SUPABASE_CONFIG abaixo (mantendo as aspas).
    6. Recarregue o site e clique "Entrar com Discord" (topo da página) com a SUA conta.
    7. No painel do Supabase: Authentication > Users, ache seu usuário na lista e copie o
       "User UID" dele.
    8. Volte no SQL Editor e rode (trocando SEU-UID-AQUI pelo UID copiado, mantendo as aspas
       simples em volta e o ::uuid depois) — só isso deixa você editar a Aliança Z; sem essa
       policy, ninguém (nem você) consegue escrever em "donations", só ler:
         create policy "so admin escreve donations" on public.donations
           for all using (auth.uid() = 'SEU-UID-AQUI'::uuid)
           with check (auth.uid() = 'SEU-UID-AQUI'::uuid);
    9. Cole esse mesmo UID no ADMIN_DISCORD_ID abaixo, no lugar de "COLE_AQUI".
    10. (Aba Perfil) Volte no SQL Editor e rode isso — cria a tabela de perfil público
        (cada pessoa só edita o próprio: nick, servidor, bio, redes) e adiciona a coluna
        que liga um apoiador da Aliança Z a um perfil:
          create table public.profiles (
            id uuid primary key references auth.users(id) on delete cascade,
            nickname text, servidor text, bio text,
            instagram text, twitch text, youtube text,
            avatar_char_id text,
            show_socials boolean not null default false,
            is_public boolean not null default false,
            updated_at timestamptz not null default now()
          );
          alter table public.profiles enable row level security;

// window.storage (get/set assíncronos por chave) pode ser injetado por um ambiente
// de hospedagem específico. Quando o arquivo é aberto direto num navegador comum,
// window.storage não existe e todo save cai quieto no catch(e){} — nada persiste
// entre sessões. Este shim cobre esse caso com localStorage puro, mantendo a mesma
// interface assíncrona {get(key)->{value}|null, set(key,value)}.
if(!window.storage){
  window.storage = {
    async get(key){
      try{
        const v = localStorage.getItem('kiai_'+key);
        return v===null ? null : { value: v };
      }catch(e){ return null; }
    },
    async set(key, value){
      try{ localStorage.setItem('kiai_'+key, value); }catch(e){}
    },
  };
}
